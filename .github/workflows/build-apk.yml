name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Marg-AppFrontend/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: Marg-AppFrontend
        run: npm ci

      - name: Expo Prebuild Android
        working-directory: Marg-AppFrontend
        run: npx expo prebuild --platform android --clean

      - name: Build Android Debug APK
        working-directory: Marg-AppFrontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MARG-Mentor-App.apk
          path: Marg-AppFrontend/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MARG Mentor App v1.0.0 (APK)"
          body: "Official Android APK build for MARG Platform evaluation."
          files: Marg-AppFrontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
